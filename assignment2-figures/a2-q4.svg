<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 295" role="img" aria-label="Q4: forces on q₂">
<rect width="520" height="295" rx="12" fill="#161a26"/>
<line x1="53.0" y1="87.5" x2="467.0" y2="87.5" stroke="#9ca3af" stroke-width="1.3"/>
<text x="202.5" y="75.5" fill="#f59e0b" font-size="12" text-anchor="middle" font-weight="bold" font-family="Inter,Arial,sans-serif">2 m</text>
<text x="375.0" y="75.5" fill="#f59e0b" font-size="12" text-anchor="middle" font-weight="bold" font-family="Inter,Arial,sans-serif">1 m</text>
<line x1="317.5" y1="87.5" x2="317.5" y2="237.5" stroke="#4b5563" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="317.5" y1="139.5" x2="281.3" y2="139.5" stroke="#fbbf24" stroke-width="3.2"/>
<polygon points="270.3,139.5 281.3,134.0 281.3,145.0" fill="#fbbf24"/>
<text x="293.9" y="131.5" fill="#fbbf24" font-size="12.5" text-anchor="middle" font-weight="bold" font-family="Inter,Arial,sans-serif">F₁₂ = 0.674 μN</text>
<line x1="317.5" y1="179.5" x2="442.3" y2="179.5" stroke="#fbbf24" stroke-width="3.2"/>
<polygon points="453.3,179.5 442.3,185.0 442.3,174.0" fill="#fbbf24"/>
<text x="385.4" y="171.5" fill="#fbbf24" font-size="12.5" text-anchor="middle" font-weight="bold" font-family="Inter,Arial,sans-serif">F₃₂ = 1.94 μN</text>
<line x1="317.5" y1="219.5" x2="395.4" y2="219.5" stroke="#4ade80" stroke-width="4"/>
<polygon points="406.4,219.5 395.4,225.0 395.4,214.0" fill="#4ade80"/>
<text x="361.9" y="211.5" fill="#4ade80" font-size="12.5" text-anchor="middle" font-weight="bold" font-family="Inter,Arial,sans-serif">Net F = 1.27 μN</text>
<circle cx="87.5" cy="87.5" r="11" fill="#ef4444"/>
<text x="87.5" y="92.5" fill="#fff" font-size="15" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">+</text>
<text x="87.5" y="65.5" fill="#e5e7eb" font-size="12.5" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">q₁ = +25 nC</text>
<circle cx="432.5" cy="87.5" r="11" fill="#ef4444"/>
<text x="432.5" y="92.5" fill="#fff" font-size="15" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">+</text>
<text x="432.5" y="65.5" fill="#e5e7eb" font-size="12.5" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">q₃ = +18 nC</text>
<circle cx="317.5" cy="87.5" r="11" fill="#3b82f6"/>
<text x="317.5" y="92.5" fill="#fff" font-size="15" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">−</text>
<text x="317.5" y="65.5" fill="#e5e7eb" font-size="12.5" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">q₂ = −12 nC</text>
<text x="260.0" y="26.0" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold" font-family="Inter,Arial,sans-serif">Q4: forces on q₂</text>
<text x="260.0" y="263.0" fill="#9ca3af" font-size="12" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">q₂ is negative, so both positive charges ATTRACT it.</text>
<text x="260.0" y="281.0" fill="#9ca3af" font-size="12" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">q₁ pulls left, q₃ pulls right — the closer q₃ wins → net force +x.</text>
</svg>
