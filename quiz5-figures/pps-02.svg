<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 214" role="img" aria-label="Bringing q₀ in from infinity to P">
<rect width="460" height="214" rx="12" fill="#161a26"/>
<line x1="90.7" y1="109.3" x2="204.7" y2="109.3" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="147.7" y="99.3" fill="#f59e0b" font-size="12" text-anchor="middle" font-weight="bold" font-family="Inter,Arial,sans-serif">r = 0.09 m</text>
<line x1="350.3" y1="109.3" x2="227.3" y2="109.3" stroke="#f59e0b" stroke-width="2.4"/>
<polygon points="217.3,109.3 227.3,104.3 227.3,114.3" fill="#f59e0b"/>
<text x="354.1" y="113.3" fill="#f59e0b" font-size="12" text-anchor="start" font-weight="normal" font-family="Inter,Arial,sans-serif">from ∞</text>
<text x="293.3" y="97.3" fill="#f59e0b" font-size="12" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">q₀ = 2×10⁻⁹ C</text>
<circle cx="90.7" cy="109.3" r="11" fill="#ef4444"/>
<text x="90.7" y="114.3" fill="#fff" font-size="15" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">+</text>
<text x="90.7" y="87.3" fill="#e5e7eb" font-size="12.5" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">q = 4×10⁻⁷ C</text>
<circle cx="204.7" cy="109.3" r="5" fill="#f9fafb"/>
<text x="204.7" y="131.3" fill="#f9fafb" font-size="13" text-anchor="middle" font-weight="bold" font-family="Inter,Arial,sans-serif">P</text>
<text x="230.0" y="26.0" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold" font-family="Inter,Arial,sans-serif">Bringing q₀ in from infinity to P</text>
<text x="230.0" y="192.0" fill="#9ca3af" font-size="12" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">V at P depends only on q and r; the work is W = q₀V.</text>
</svg>
