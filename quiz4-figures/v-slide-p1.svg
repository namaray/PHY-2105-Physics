<text x="347.2" y="167.8" fill="#4ade80" font-size="13" text-anchor="start" font-weight="bold" font-family="Inter,Arial,sans-serif">E = 6.93 kQ/d²</text>
<circle cx="99.7" cy="108.5" r="11" fill="#ef4444"/>
