<text x="355.2" y="260.1" fill="#e5e7eb" font-size="12.5" text-anchor="start" font-weight="normal" font-family="Inter,Arial,sans-serif">q2 = −2Q</text>
<circle cx="332.7" cy="108.5" r="11" fill="#3b82f6"/>
