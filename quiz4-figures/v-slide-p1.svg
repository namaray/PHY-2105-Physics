<text x="270.0" y="329.0" fill="#9ca3af" font-size="12" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">E1 and E2 point the same way (both along −30°), so they add first.</text>
<text x="270.0" y="347.0" fill="#9ca3af" font-size="12" text-anchor="middle" font-weight="normal" font-family="Inter,Arial,sans-serif">The y-parts of (E1+E2) and E3 cancel; the x-parts double.</text>
